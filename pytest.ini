[pytest]
testpaths = TestCase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --alluredir=allure-results --clean-alluredir
markers =
    smoke: Quick sanity check tests
    regression: Comprehensive regression test suite
    elements: Tests for Elements module
    forms: Tests for Forms module
    alerts_frames: Tests for Alerts, Frame & Windows module
    widgets: Tests for Widgets module
    interactions: Tests for Interactions module

